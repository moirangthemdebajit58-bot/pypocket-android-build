
name: Build PyPocket APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew found in the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"
          
      
      - name: Prepare Android build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted")
          props = root / "gradle.properties"
          text = props.read_text() if props.exists() else ""

          settings = {
              "android.useAndroidX": "true",
              "org.gradle.jvmargs": "-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
              "org.gradle.workers.max": "2",
          }

          lines = [line for line in text.splitlines()
                   if not any(line.strip().startswith(k + "=") for k in settings)]
          lines += [f"{k}={v}" for k, v in settings.items()]
          props.write_text("\n".join(lines) + "\n")

          files = list(root.glob("app/src/main/java/**/EditorScreen.kt"))
          if not files:
              raise SystemExit("EditorScreen.kt not found")

          for p in files:
              source = p.read_text()
              if "FontWeight" in source and \
                 "import androidx.compose.ui.text.font.FontWeight" not in source:
                  lines = source.splitlines()
                  index = next((i for i, line in enumerate(lines)
                                if line.startswith("package ")), None)
                  if index is None:
                      raise SystemExit(f"Package declaration not found in {p}")
                  lines.insert(index + 1, "")
                  lines.insert(index + 2,
                               "import androidx.compose.ui.text.font.FontWeight")
                  p.write_text("\n".join(lines) + "\n")
                  print(f"Added FontWeight import to {p}")
          PY

      

    
  
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("gradlew")
          s = p.read_text()

          s = re.sub(
              r'^DEFAULT_JVM_OPTS=.*$',
              'DEFAULT_JVM_OPTS="-Xmx64m -Xms64m"',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^exec "\$JAVACMD".*$',
              'exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"',
              s,
              flags=re.MULTILINE
          )

          if 'org.gradle.wrapper.GradleWrapperMain' not in s:
              raise SystemExit("Could not repair Gradle launcher")

          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon assembleDebug



      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PyPocket-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
