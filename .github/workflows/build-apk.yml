
name: Build PyPocket APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$zip_file" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$zip_file" -d extracted
          wrapper="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$wrapper" ]; then
            echo "No Gradle wrapper found in ZIP."
            exit 1
          fi
          project_dir="$(dirname "$wrapper")"
          if [ ! -f "$project_dir/settings.gradle.kts" ] && [ ! -f "$project_dir/settings.gradle" ]; then
            echo "Gradle settings file is missing beside gradlew."
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          chmod +x "$wrapper"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PyPocket-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

